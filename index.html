<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArticulPro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ArticulPro">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ec;--card:#fff;--ink:#1d2433;--mut:#667085;--acc:#1f4fd8;--ok:#1a8a4a;--mid:#b86e00;--bad:#c62f3a;--line:#e3ddd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10141c;--card:#1a2030;--ink:#eef1f7;--mut:#9aa4b8;--acc:#7da2ff;--ok:#4cc27f;--mid:#e5a33a;--bad:#ff6b76;--line:#2a3247}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10141c;--card:#1a2030;--ink:#eef1f7;--mut:#9aa4b8;--acc:#7da2ff;--ok:#4cc27f;--mid:#e5a33a;--bad:#ff6b76;--line:#2a3247}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0}.sub{color:var(--mut);margin:2px 0 16px;font-style:italic}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
.rule{background:color-mix(in srgb,var(--acc) 10%,transparent);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:.92rem;margin-bottom:14px}
.txt{font-size:1.55rem;line-height:1.35;text-align:center;margin:10px 0 18px;word-break:break-word}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.b{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;background:var(--acc);color:#fff}
button.b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.b.rec{background:var(--bad)}
label{font-size:.85rem;color:var(--mut);display:flex;align-items:center;gap:6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut);font-size:.9rem}
.score{font-size:2.2rem;font-weight:bold;text-align:center}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%}
.w{display:inline-block;margin:2px 3px;padding:1px 7px;border-radius:7px;font-size:1.05rem}
.w.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.w.near{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.w.ko{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);text-decoration:underline wavy}
.iss{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}.mut{color:var(--mut)}
.msg{text-align:center;color:var(--mut);font-size:.9rem;margin-top:12px}
</style></head><body><main>
<h1>🗣️ ArticulPro</h1>
<p class="sub">Écoute, répète, corrige-toi. Ta bouche aussi a droit à sa salle de sport.</p>
<button class="chip" id="inst" hidden style="margin-bottom:10px">📲 Installer l’appli</button>
<div class="chips" id="chips"></div>
<div class="card" id="card"></div>
<div class="nav"><button class="b alt" id="prev">‹ Préc.</button><span id="pos"></span><button class="b alt" id="next">Suiv. ›</button></div>
<p class="msg" id="stat"></p>
</main>
<script>
const CATS={seance:"⭐ Séance 5 min",ech:"Échauffement",son:"Sons & syllabes",mots:"Mots difficiles",vire:"Virelangues",phr:"Phrases",souf:"Souffle & débit",gp:"Grammaire · primaire",gc:"Grammaire · B2–C2"};
const D=[
["mots","grenouille"],["mots","chrysanthème"],["mots","anticonstitutionnellement"],["mots","oignon"],["mots","serrurier"],["mots","bouillabaisse"],["mots","hippopotame"],["mots","inintelligible"],["mots","rhododendron"],["mots","ensorceler"],
["vire","Les chaussettes de l’archiduchesse sont-elles sèches, archi-sèches ?"],["vire","Un chasseur sachant chasser doit savoir chasser sans son chien."],["vire","Trois tortues trottaient sur un trottoir très étroit."],["vire","Si six scies scient six cyprès, six cent six scies scient six cent six cyprès."],["vire","Ton thé t’a-t-il ôté ta toux ?"],["vire","Piano, panier, panier, piano."],
["phr","Je voudrais un croissant et un verre d’eau, s’il vous plaît."],["phr","Il faut que nous partions avant que la nuit ne tombe."],["phr","La brise légère caressait les feuilles du vieux chêne."],
["gp","Il a un chat, et il va à l’école.","a / à : « a » = verbe avoir (on peut dire « avait »). « à » = préposition, on ne peut pas le remplacer."],
["gp","Marie est contente et fière.","est / et : « est » = verbe être (« était »). « et » = relie deux mots."],
["gp","Ils ont faim, on mange ensemble.","on / ont : « ont » = verbe avoir (« avaient »). « on » = « quelqu’un », sujet."],
["gp","Ils sont ravis de son cadeau.","sont / son : « sont » = verbe être (« étaient »). « son » = déterminant (« mon, ton, son »)."],
["gp","Ce garçon se lave les mains.","ce / se : « ce » désigne (« ce garçon »). « se » accompagne un verbe pronominal."],
["gp","Une grande maison blanche.","Féminin des adjectifs : on ajoute généralement un « e » (grand → grande) et la consonne finale se prononce."],
["gp","Les enfants jouent dans les jardins.","Pluriel : on ajoute un « s » au nom, mais il ne se prononce pas. Seul l’article « les » trahit le pluriel à l’oral."],
["gc","Bien que ce soit difficile, il persévère.","« Bien que » est suivi du subjonctif (et non de l’indicatif)."],
["gc","Les lettres qu’il a écrites sont arrivées.","Accord du participe passé avec « avoir » : il s’accorde avec le COD placé avant le verbe (« que » = les lettres)."],
["gc","Elles se sont parlé longuement.","Verbe pronominal + COI (parler à) : le participe passé reste invariable."],
["gc","Quelles que soient tes raisons, je t’écoute.","« Quel que » (en deux mots) + verbe être au subjonctif : « quel » s’accorde avec le sujet."],
["gc","Elle est toute contente, mais elle est tout étonnée.","« Tout » devant adjectif féminin : variable devant consonne (toute contente), invariable devant voyelle (tout étonnée)."],
["gc","Si j’avais su, je serais venu plus tôt.","Hypothèse irréelle du passé : si + plus-que-parfait → conditionnel passé."],
["gc","Il fallait qu’elle partît avant l’aube.","Concordance des temps soutenue : verbe principal au passé → subjonctif imparfait (« partît »)."],
["ech","CHHHHH","Souffle continu et régulier, comme un pneu qui se dégonfle.",10],
["ech","JJJJJJ","Même souffle, mais avec la voix qui vibre.",10],
["ech","Aaaaah","Voix grave, mâchoire relâchée, bouche grande ouverte.",10],
["ech","Brrrrrr","Vibration des lèvres, deux doigts sur les pommettes pour détendre le visage.",10],
["ech","OU – AH","Laisse tomber la mâchoire : « ou » lèvres en avant, « ah » bouche grande ouverte. Une dizaine de fois.",20],
["ech","Langue en balayage","Avec un crayon dans la bouche, passe la langue dessus puis dessous, 10 fois.",20],
["son","bam dam gam vam zam","Syllabes pour muscler lèvres, langue et gorge. Ouvre grand sur le « a ». La reconnaissance vocale est capricieuse ici : vise la netteté."],
["son","bèm dèm gèm vèm zèm"],["son","bom dom gom vom zom"],["son","pam tam kam fam sam"],["son","pèm tèm kèm fèm sèm"],["son","pom tom kom fom som"],
["son","bambar damdar gamgar vamvar zamzar","Deux syllabes qui s’enchaînent : garde le même rythme sur chacune."],
["son","kapr kèpr kopr kupr kipr","Groupes de consonnes : prononce bien le « r » final, sans ajouter de « e »."],
["son","kapl kèpl kopl kupl kipl"],
["son","biche bridge brigue gigue guigne guide grippe grime grise crise"],
["son","Tadalarana tedelerene tidilirini todolorono tudulurunu","Chaque voyelle a sa forme de lèvres : a, e, i, o, u."],
["vire","Cinq chiens chassent six chats."],["vire","Douze douches douces, douze douches chaudes."],["vire","Seize chaises sèchent."],
["vire","La pie pond sans piper devant le paon pompeux qui papote."],
["vire","Le respectable spectre du spectacle inspecte l’estrade esquintée."],
["vire","Je veux et j’exige d’exquises excuses."],
["vire","Ces Basques se passent ce casque et ce masque jusqu’à ce que ce masque et ce casque se cassent."],
["vire","Didon dîna, dit-on, du dos d’un dodu dindon."],["vire","Six slips chics, six chics slips."],
["vire","Trois très gros, gras, grands rats gris grattent."],
["vire","Donnez-lui à minuit huit fruits cuits et si ces huit fruits cuits lui nuisent, donnez-lui huit fruits crus."],
["vire","Un pêcheur péchait sous un pêcher qui l’empêchait de bien pécher."],
["vire","Fruit, fuite et frite firent frite fuite et fruit."],
["vire","Bruno bêche Benoît bine ; Bruno bine Benoît bêche."],
["vire","Allez ! Allo ? Aller allo ?","Répète en accélérant à chaque tour, sans manger les syllabes."],
["phr","Mon père est maire, mon frère est masseur."],["phr","As-tu été à Tahiti ?"],
["phr","Pour qui sont ces serpents qui sifflent sur nos têtes ?"],
["phr","Je ne sais pas, je te le dis.","Prononce toutes les syllabes : pas de « chais pas » ni de « jte ldis ». Soigne aussi les liaisons."],
["souf","Oh ! Combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines dans ce morne horizon se sont évanouis !","Défi souffle : dis tout d’une seule expiration, sans te précipiter (Victor Hugo, ça se respire)."],
["souf","C’est l’histoire de l’évadé du Nevada qui s’évada dans la vallée, dans la vallée du Nevada qu’il dévala pour s’évader sur un vilain vélo volé qu’il a volé dans la villa.","✏️ Coince un crayon entre tes dents : si on te comprend, ta diction est solide."],
["souf","Ah pourquoi Pépita, sans répit m’épies-tu ? Dans les bois Pépita, pourquoi te tapis-tu ? Tu m’épies sans pitié, c’est piteux de m’épier. De m’épier Pépita pourrais-tu te passer ?","À dire le plus vite possible, en gardant le rythme."],
["souf","Madame S. est une Suissesse. Au sous-sol de sa maison, elle chausse ses souliers secs, saisit son sac et sort sur le seuil, seule dans le silence du soir.","Un festival de « s » : souffle doux, langue derrière les dents du haut."]
];
const TIPS=[
[/gn/,"« gn » = [ɲ] : le milieu de la langue se plaque contre le palais, comme dans « montagne »."],
[/ill/,"« ill » se dit le plus souvent [j] (fille, grenouille) : un « y » rapide."],
[/ou/,"« ou » = [u] : lèvres bien arrondies et projetées vers l’avant."],
[/eu/,"« eu » = [ø]/[œ] : lèvres arrondies comme pour « o », langue placée comme pour « é »."],
[/(^|[^oq])u/,"« u » = [y] : lèvres en avant comme pour « ou », mais langue haute et avancée comme pour « i »."],
[/qu/,"« qu » se prononce [k], le « u » est muet."],
[/ch/,"« ch » = [ʃ] : lèvres projetées, souffle continu et doux, sans vibration."],
[/tion/,"« tion » se dit [sjɔ̃] : « sion »."],
[/(on|om)(?![aeiou])/,"« on » est nasale [ɔ̃] : la voix passe par le nez, on n’entend pas de « n »."],
[/(an|am|en|em)(?![aeiou])/,"« an/en » = [ɑ̃] : nasale ouverte, bouche grande ouverte, pas de « n » audible."],
[/(in|ain|ein|im)(?![aeiou])/,"« in/ain » = [ɛ̃] : nasale, léger sourire, pas de « n » audible."],
[/[aeiouy]s[aeiouy]/,"un « s » entre deux voyelles se prononce [z]."],
[/r/,"le « r » français est postérieur : racine de la langue vers le fond de la gorge, pointe contre les dents du bas."],
[/[bcdfgklmnpstxz]$/,"consonne finale souvent muette : ne la prononce pas (sauf liaison)."]
];
let cat="seance",idx=0,slow=false,pen=false,best={};
const iso=d=>d.toISOString().slice(0,10);
function days(add){let a=[];try{a=JSON.parse(localStorage.getItem("articulpro-days")||"[]");if(add&&!a.includes(iso(new Date()))){a.push(iso(new Date()));localStorage.setItem("articulpro-days",JSON.stringify(a.slice(-90)))}}catch(e){}return a}
function streak(){const a=days();let n=0,d=new Date();while(a.includes(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
try{best=JSON.parse(localStorage.getItem("articulpro-best")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clean=s=>s.toLowerCase().replace(/œ/g,"oe").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’'\-]/g," ").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const eq=(a,b)=>lev(a,b)<=(a.length>4?1:0);
function compare(target,heard){
 const T=clean(target),H=clean(heard),n=T.length,m=H.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)L[i][j]=eq(T[i-1],H[j-1])?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
 const st=Array(n).fill("ko"),used=Array(m).fill(false);let i=n,j=m;
 while(i>0&&j>0){if(eq(T[i-1],H[j-1])&&L[i][j]===L[i-1][j-1]+1){st[i-1]=T[i-1]===H[j-1]?"ok":"near";used[j-1]=true;i--;j--}else if(L[i-1][j]>=L[i][j-1])i--;else j--}
 const free=H.filter((_,k)=>!used[k]);
 const disp=target.replace(/[’'\-]/g," ").replace(/[.,;:!?«»]/g," ").split(/\s+/).filter(Boolean);
 const words=T.map((w,k)=>{let alt=null,d=99;if(st[k]!=="ok")free.forEach(h=>{const x=lev(w,h);if(x<d&&x<=Math.max(3,w.length/2)){d=x;alt=h}});return{w,show:disp.length===n?disp[k]:w,s:st[k],alt}});
 const sc=Math.round(words.reduce((a,x)=>a+(x.s==="ok"?1:x.s==="near"?.5:0),0)/n*100);
 return{words,sc}}
const tip=w=>{const t=TIPS.find(t=>t[0].test(w));return t?t[1]:"détache les syllabes, répète lentement, puis accélère peu à peu."};
const list=()=>cat==="seance"?plan():D.filter(d=>d[0]===cat);
function plan(){const d=Math.floor(Date.now()/864e5),pk=(c,n=1)=>{const a=D.filter(x=>x[0]===c);return Array.from({length:n},(_,i)=>a[(d*n+i)%a.length])};return[...pk("ech",2),...pk("son"),...pk("mots"),...pk("vire",2),...pk("souf"),...pk("gp"),...pk("gc")]}
function timer(s,key){const b=$("tm");b.disabled=true;let t=s;window.tid=setInterval(()=>{b.textContent="⏳ "+t+" s";if(t--<=0){clearInterval(window.tid);b.disabled=false;b.textContent="✅ Bravo ! Relancer";best[key]=100;try{localStorage.setItem("articulpro-best",JSON.stringify(best))}catch(e){}days(1)}},1000)}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=slow?.55:.95;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function render(){clearInterval(window.tid);
 $("chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip${k===cat?" on":""}" data-k="${k}">${v}</button>`).join("");
 const L=list(),it=L[idx],key=it[1];
 $("card").innerHTML=(it[2]?`<div class="rule">📖 ${esc(it[2])}</div>`:"")+`<div class="txt">${esc(it[1])}</div>
 ${it[3]?`<div class="row"><button class="b" id="tm">⏱ Lancer (${it[3]} s)</button></div>`:`<div class="row"><button class="b alt" id="hear">🔊 Écouter</button><button class="b" id="say">🎙️ Répéter</button></div>`}
 <div class="row" style="margin-top:10px"><label><input type="checkbox" id="slow"${slow?" checked":""}> 🐢 Lent</label><label><input type="checkbox" id="pen"${pen?" checked":""}> ✏️ Crayon en bouche</label></div><div id="res"></div>`;
 $("pos").textContent=`${idx+1} / ${L.length}`+(best[key]!=null?` · record ${best[key]} %`:"");
 const mast=D.filter(d=>(best[d[1]]||0)>=90).length;
 $("stat").textContent=`${mast} / ${D.length} exercices maîtrisés (≥ 90 %) · 🔥 ${streak()} jour(s) d’affilée`;
 if(it[3]){$("tm").onclick=()=>timer(it[3],key)}else{$("hear").onclick=()=>speak(key);$("say").onclick=()=>listen(key)}$("slow").onchange=e=>{slow=e.target.checked};$("pen").onchange=e=>{pen=e.target.checked}}
function show(key,r,heard){
 if(r.sc>(best[key]||0)){best[key]=r.sc;try{localStorage.setItem("articulpro-best",JSON.stringify(best))}catch(e){}}days(1);
 const col=r.sc>=90?"var(--ok)":r.sc>=60?"var(--mid)":"var(--bad)";
 const verdict=(pen&&r.sc>=70?"✏️ Compris avec un crayon en bouche : diction béton ! ":"")+(r.sc>=90?"Impeccable. Les Académiciens applaudissent. 👏":r.sc>=60?"Pas mal, encore un petit effort !":"On retente : la diction se forge à force de répétitions.");
 const bad=r.words.filter(x=>x.s!=="ok");
 $("res").innerHTML=`<div class="score" style="color:${col}">${r.sc} %</div><div class="bar"><i style="width:${r.sc}%;background:${col}"></i></div><div class="msg" style="margin:0 0 10px">${verdict}</div>
 <div style="text-align:center">${r.words.map(x=>`<span class="w ${x.s}">${esc(x.show)}</span>`).join("")}</div>
 <p class="mut" style="text-align:center">J’ai entendu : « ${esc(heard)} »</p>`+
 bad.map(x=>`<div class="iss"><b>${esc(x.show)}</b> ${x.alt?`<span class="mut">— entendu « ${esc(x.alt)} »</span>`:`<span class="mut">— non reconnu</span>`}<br>💡 ${tip(x.w)}</div>`).join("")}
function listen(key){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,res=$("res"),btn=$("say");
 if(!SR){res.innerHTML=`<p class="msg">Ton navigateur n’a pas de reconnaissance vocale. Essaie Chrome, Edge ou Safari. En attendant, écoute et répète à voix haute !</p>`;return}
 const r=new SR();r.lang="fr-FR";r.maxAlternatives=3;r.interimResults=false;
 btn.classList.add("rec");btn.textContent="⏺ Je t’écoute…";
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);let b=null;alts.forEach(a=>{const c=compare(key,a);if(!b||c.sc>b.r.sc)b={r:c,a}});show(key,b.r,b.a)};
 r.onerror=e=>{res.innerHTML=`<p class="msg">${e.error==="not-allowed"||e.error==="service-not-allowed"?"Micro bloqué : autorise-le dans ton navigateur (ou ouvre la page dans un onglet à part).":e.error==="no-speech"?"Je n’ai rien entendu. Rapproche-toi du micro et réessaie.":"Souci de reconnaissance ("+e.error+"). Réessaie."}</p>`};
 r.onend=()=>{btn.classList.remove("rec");btn.textContent="🎙️ Répéter"};
 try{r.start()}catch(e){}}
document.addEventListener("click",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){cat=k;idx=0;render()}});
$("prev").onclick=()=>{const n=list().length;idx=(idx-1+n)%n;render()};
$("next").onclick=()=>{idx=(idx+1)%list().length;render()};
render();
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").hidden=false});
$("inst").onclick=async()=>{if(dp){dp.prompt();dp=null}$("inst").hidden=true};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
